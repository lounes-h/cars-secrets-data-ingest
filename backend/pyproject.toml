[project]
name = "cars-ingest"
version = "0.1.0"
description = "Continuous ingestion of vehicle auction CSV exports (Copart first) into PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.4",
    "watchdog>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "itsdangerous>=2.2",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "structlog>=24.4",
    "xgboost>=3.1 ; sys_platform != 'linux'",
    "xgboost-cpu>=3.1 ; sys_platform == 'linux'",
    "pandas>=3.0",
    "anthropic>=1.0",
    "pillow>=11",
]

[project.optional-dependencies]
# Host-side Copart downloader (drives the installed Google Chrome).
downloader = ["playwright>=1.47"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
source = ["ingest"]
branch = true
# Playwright's sync API runs page code in greenlets, which coverage only follows when told to.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
